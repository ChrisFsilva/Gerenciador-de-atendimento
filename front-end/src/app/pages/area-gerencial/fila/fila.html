<div class="infotable">
    <table class="w-full">

        <tbody class="filaSequency">
            <tr *ngFor="let usuario of usuariosFila">
                
                <td>
                    <b>Usuário:</b> {{ usuario.nome }}
                </td>

                <td>
                    <b>Entrada:</b> {{ usuario.entrada | date:'dd/MM/yyyy HH:mm' }}
                </td>

                <td>
                    <b>Última atividade:</b> {{ usuario.ultima_atividade | date:'dd/MM/yyyy HH:mm' }}
                </td>
            </tr>
        </tbody>
    </table>
</div>
