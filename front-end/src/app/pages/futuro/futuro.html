<div class="cards">
    <div
        *ngFor="let cliente of listaFuturo"
        class="
            bg-white
            rounded-2xl
            shadow-lg
            border
            border-slate-200
            p-5
            transition
            hover:shadow-xl
            hover:-translate-y-1
            cursor-pointer
        ">
        <!-- Cabeçalho -->
        <div class="flex justify-between items-center">
            <span class="card-date">
                <div>
                    <i class="fa-solid fa-calendar-days mr-2"></i>
                    {{ cliente.data_contato | date:'dd/MM/yyyy HH:mm' }}
                </div>
            </span>

        </div>
        <h2 class="mt-5 text-xl font-semibold text-slate-800">
            {{ cliente.cliente }}
        </h2>
        <div class="mt-4 space-y-2 text-slate-500 text-sm">
            <div>
                Preferencia de contato: {{ cliente.forma_contato }}
            </div>
            <div>
                <i class="fa-solid fa-phone mr-2"></i>
                {{ cliente.telefone }}
            </div>
            <div>
                <i class="fa-solid fa-at mr-2"></i>
                {{ cliente.email }}
            </div>
        </div>
        <!-- Botões -->
        <div class="flex gap-3 mt-6">
            <button
                class="
                    flex-1
                    bg-green-600
                    hover:bg-green-700
                    text-white
                    rounded-lg
                    py-2
                    font-medium
                ">
                Converter em follow
            </button>
        </div>
    </div>
</div>
