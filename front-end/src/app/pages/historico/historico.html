<div class="infotable">
    <table class="w-full">
        <thead>
            <tr>
                <th>Entrada</th>
                <th>Usuário</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let usuario of historicoDia">
                <td>{{ usuario.entrada | date:'dd/MM/yyyy HH:mm'}}</td>
                <td>{{ usuario.nome }}</td>
            </tr>
        </tbody>
    </table> 
</div>
