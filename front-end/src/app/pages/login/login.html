<div id="toast-container"></div>
<div class="container">

    <!-- LOGIN -->
    <div class="login-area">
      <div class="login-box">

        <h2 class="logoName">MÉTODO MVB</h2>

        <div class="input-group">
          <label>Login</label>
          <input 
            type="text" 
            placeholder="Digite seu usuário"
            [(ngModel)]="email">
        </div>

        <div class="input-group">
          <label>Senha</label>
          <input
            type="password" 
            placeholder="Digite sua senha"
            [(ngModel)]="senha">
        </div>

        <button 
            class="btn-login"
            (click)="login()">
          LOGAR
        </button>

      </div>
    </div>

    <!-- ILUSTRAÇÃO -->
    <div class="image-area">

      <div class="illustration">

        <div class="window">

          <div class="window-header">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
          </div>

          <div class="window-content">
            <div>
                <img class="lux-icon" src="/assets/homePageIcon.png" />
            </div>
            <h3>SEJA BEM VINDO A BRENTWOOD</h3>
            <p>Bora bater todas as metas!</p>
          </div>

        </div>

      </div>

    </div>

  </div>
