<!-- Fundo -->
<div class="
    bg-slate-50
    rounded-b-2xl
    shadow-2xl
    p-8
    sm:p-12
    flex
    flex-col
    items-center
    border border-slate-200/50">

    <!-- SISTEMA DE NOTIFICAÇÃO -->
    <div id="toast-container"></div>
    <!-- TEXTO DE POSIÇÃO DA FILA-->
    <h2 class="
        mt-5
        text-lg
        sm:text-xl
        text-slate-600
        font-medium
        text-center"> 
        Sua posição na fila:
    </h2>
    <!-- INDICADOR CIRCULAR DA FILA -->
    <div class="relative mt-4">
        <!-- GLOW -->
        <div class="
            absolute
            inset-0
            rounded-full
            bg-slate-200
            animate-pulse-slow
            scale-110
            opacity-50">
        </div>
        <!-- CIRCULO PRINCIPAL -->
        <div class="
            relative
            w-40
            h-40
            sm:w-48
            sm:h-48
            rounded-full
            border-[6px]
            border-slate-800
            flex
            items-center
            justify-center
            bg-white
            shadow-inner">
            <!-- NÚMERO NA FILA -->
            <span class="text-7xl
                sm:text-8xl
                font-light
                text-slate-800
                leading-none">
            1
            </span>
        </div>
    </div>
    <!-- BOTÕES INFERIORES -->
    <div class="
        flex
        flex-col
        sm:flex-row
        gap-4
        sm:gap-6
        mt-10
        w-full
        justify-center">

        <!-- BOTÃO REGISTRAR ATENDIMENTO -->
        <button
            (click)="showToast('Atendimento registrado com sucesso!','sucess')"
            class="
                flex
                items-center
                justify-center
                gap-3
                bg-[#44b564]
                hover:bg-[#2e8245]
                text-white
                py-4
                rounded-xl
                shadow-lg
                shadow-green-500/20
                transition-colors
                duration-200
                active:bg-[#256a38]
                w-full
                sm:w-72
            ">

            <i class="fa-solid fa-check text-lg"></i>

            <span class=" font-semibold tracking-wide">
                REGISTRAR ATENDIMENTO
            </span>
        </button>

        <!-- BOTÃO SAIR DA FILA -->
        <button
            (click)="showToast('Você saiu da fila','error')"
            class="
                            flex
                items-center
                justify-center
                gap-3
                bg-[#d94848]
                hover:bg-[#a63030]
                text-white
                py-4
                rounded-xl
                shadow-lg
                shadow-red-500/20
                transition-colors
                duration-200
                active:bg-[#852525]
                w-full
                sm:w-72
            ">
            <i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>

            <span class="
            font-semibold
            tracking-wide">
                SAIR DA FILA
            </span>
        </button>
        
    </div>
</div>
